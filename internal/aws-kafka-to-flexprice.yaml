# AWS MSK (Kafka) -> Flexprice API.
#
# Reads events from an AWS MSK topic and POSTs each event to the Flexprice
# ingest API. The only transform is coercing properties values to strings (the
# SDK requires it); the event is otherwise sent to Flexprice as-is.
#
# All connection details are env-driven; this one file covers every MSK
# listener type by setting two variables — no config edit needed.
#
#   Listener                     Port   AWS_KAFKA_TLS_ENABLED  AWS_KAFKA_SASL_MECHANISM
#   ---------------------------  -----  ---------------------  ------------------------
#   SASL/SCRAM over TLS          9096   true                   SCRAM-SHA-512  (default)
#   TLS, no auth                 9094   true                   none
#   PLAINTEXT (no TLS, no auth)  9092   false                  none
#   SASL/PLAIN over TLS          9096   true                   PLAIN
#
# Notes:
#   * `none` disables SASL entirely; user/password are ignored and may be unset.
#   * PLAINTEXT sends everything unencrypted, including event payloads. Only use
#     it for a broker reachable solely from inside the VPC.
#   * MSK does not offer a SASL/PLAIN listener — `PLAIN` is here for
#     Confluent-style or self-managed brokers reusing this config. It sends the
#     password essentially in the clear, so never pair it with TLS disabled.

input:
  kafka:
    # MSK bootstrap brokers. Port depends on the listener — see table above.
    addresses:
      - ${AWS_KAFKA_BROKERS}

    topics:
      - ${AWS_KAFKA_TOPIC}

    consumer_group: ${AWS_KAFKA_CONSUMER_GROUP:flexprice-bento}
    start_from_oldest: ${AWS_KAFKA_START_FROM_OLDEST:true}

    tls:
      # Set false ONLY for the PLAINTEXT listener (:9092).
      enabled: ${AWS_KAFKA_TLS_ENABLED:true}

    sasl:
      # SCRAM-SHA-512 (MSK default) | none | PLAIN | AWS_MSK_IAM
      mechanism: ${AWS_KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      # Unused when mechanism is `none`; empty defaults keep them optional so
      # the unauthenticated listeners need no credential vars at all.
      user: ${AWS_KAFKA_SASL_USER:}
      password: ${AWS_KAFKA_SASL_PASSWORD:}

    client_id: ${AWS_KAFKA_CLIENT_ID:flexprice-bento}

    commit_period: ${AWS_KAFKA_COMMIT_PERIOD:5s}
    max_processing_period: ${AWS_KAFKA_MAX_PROCESSING_PERIOD:60s}
    fetch_buffer_cap: ${AWS_KAFKA_FETCH_BUFFER_CAP:1000}
    checkpoint_limit: ${AWS_KAFKA_CHECKPOINT_LIMIT:100}

pipeline:
  processors:
    # The Flexprice SDK types properties as map[string]string. A raw number or
    # bool under properties fails json.Unmarshal in the output, which poisons
    # the partition (offset never commits, message redelivered forever). Coerce
    # every property value to a string so the SDK always accepts it.
    - mapping: |
        root = this
        root.properties = if this.properties.type() == "object" {
          this.properties.map_each(p -> p.value.string())
        } else {
          {}
        }

output:
  # retry caps transient failures (429/5xx/network). A permanent failure (bad
  # event_name, 400) still nacks after the cap; the coercion processor above is
  # what keeps malformed properties from ever reaching that path.
  retry:
    max_retries: ${FLEXPRICE_MAX_RETRIES:3}
    backoff:
      initial_interval: 1s
      max_interval: 30s
    output:
      flexprice:
        api_host: ${FLEXPRICE_API_HOST:api.cloud.flexprice.io}
        api_key: ${FLEXPRICE_API_KEY}
        scheme: ${FLEXPRICE_SCHEME:https}

        # ---------------------------------------------------------------------
        # Batching controls WHICH Flexprice endpoint is used. The policy is read
        # once at startup:
        #
        #   * Policy is a no-op  -> a 1-event flush goes to the SINGLE event
        #                           endpoint; a multi-event flush -> bulk.
        #   * Policy is active   -> EVERY flush goes to the BULK endpoint,
        #                           including one holding a single event.
        #
        # Defaults below are empty/1, which Bento treats as a no-op policy, so
        # out of the box this config runs in single-event mode. Set
        # FLEXPRICE_BATCH_COUNT (>1) and/or FLEXPRICE_BATCH_PERIOD for bulk.
        #
        # count must be >1 to activate the policy — count=1 on its own is still
        # a no-op. Batches over 1000 are chunked automatically by the output
        # plugin to respect the bulk API limit.
        # ---------------------------------------------------------------------
        batching:
          count: ${FLEXPRICE_BATCH_COUNT:1}
          period: ${FLEXPRICE_BATCH_PERIOD:}
          byte_size: ${FLEXPRICE_BATCH_BYTE_SIZE:0}

logger:
  level: ${LOG_LEVEL:INFO}
  format: logfmt
  add_timestamp: true
