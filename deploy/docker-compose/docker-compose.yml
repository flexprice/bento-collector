# Try the collector UI on one machine. Connections and credentials are owned by
# this deployment: edit connections.yaml and put the secrets in .env
# (PROMETHEUS_PASSWORD, FLEXPRICE_API_KEY, COLLECTOR_UI_TOKEN). The UI manages collectors.
#   docker compose up -d
# Run a day by hand (or from cron):
#   docker compose run --rm collector-ui collector run --all
#   docker compose run --rm collector-ui collector run --collector <id> --from 2026-11-01 --day 2026-11-07
services:
  collector-ui:
    image: ghcr.io/flexprice/bento-collector:latest
    command: ["collector", "serve", "--addr", ":8090"]
    env_file: .env
    environment:
      COLLECTOR_GIT: "true"
      COLLECTOR_CONNECTIONS_FILE: /config/connections.yaml
      COLLECTOR_LOCK_CONNECTIONS: "true"
      COLLECTOR_UI_TOKEN: ${COLLECTOR_UI_TOKEN:?set COLLECTOR_UI_TOKEN}
    ports: ["127.0.0.1:8090:8090"]
    volumes:
      - collector-data:/data
      - ./connections.yaml:/config/connections.yaml:ro
volumes:
  collector-data:
