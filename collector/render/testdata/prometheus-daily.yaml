# Rendered from collector syncron-cpu-hours v3 for 2026-11-16. Do not edit; change the spec instead.
http:
  enabled: false
input:
  generate:
    count: 1
    interval: ""
    mapping: root = "query=sum+by+%28label_tags_syncron_com_sy_tenant%2C+instance%29+%28label_replace%28sum_over_time%28dp_dsi_pod_cpu_requests_cores%5B1d%5D%29%2C+%22instance%22%2C+%22%241%22%2C+%22label_tags_syncron_com_dataops_data_service_instance%22%2C+%22%28.%2A%29%22%29%29+%2F+60&time=2026-11-17T00%3A00%3A00Z"
logger:
  format: logfmt
  level: WARN
output:
  switch:
    cases:
      - check: errored()
        output:
          reject: 'collector syncron-cpu-hours rejected a row: ${! error() }'
      - check: '@collector_skip == "true"'
        output:
          drop: {}
      - output:
          flexprice:
            api_host: api.cloud.flexprice.io
            api_key: ${FLEXPRICE_API_KEY}
            batching:
              count: 1000
              period: 1s
            scheme: https
pipeline:
  processors:
    - try:
        - http:
            headers:
              Authorization: Bearer ${PROMETHEUS_TOKEN}
              Content-Type: application/x-www-form-urlencoded
            retries: 3
            timeout: 30s
            url: https://prometheus.syncron.internal/api/v1/query
            verb: POST
          label: prometheus_query
        - label: prometheus_result
          mapping: |
            root = if this.status != "success" {
              throw("Prometheus query failed: " + this.error.or("unknown error"))
            } else if this.data.resultType != "vector" {
              throw("Expected an instant vector, got " + this.data.resultType.string())
            } else if this.warnings.or([]).length() > 0 {
              throw("Prometheus returned warnings, usage may be partial: " + this.warnings.join("; "))
            } else { this.data.result }
        - unarchive:
            format: json_array
        - label: flexprice_event
          mapping: |
            let labels = this.metric.or({})
            let raw = this.value.index(1).string()
            let key = $labels.get("label_tags_syncron_com_sy_tenant").or("")
            let skip = [].contains($key)
            let value = if $raw.re_match("^(NaN|[+-]?Inf)$") { if $skip { 0 } else { throw("Non-finite value " + $raw) } } else { $raw.number() }
            let _neg = if !$skip && $value < 0 { throw("Negative value " + $raw) }
            let _eval = if this.value.index(0).number() != 1794873600 { throw("Unexpected evaluation time " + this.value.index(0).string()) }
            let _req = if !$skip && $labels.get("instance").or("") == "" { throw("Missing required label instance") }
            let _key = if $key == "" { throw("Missing customer label label_tags_syncron_com_sy_tenant") }
            let customer = if $skip { "" } else { {"trn_acme": "cust_acme", "trn_globex": "cust_globex"}.get($key).or(throw("No customer mapped for " + "label_tags_syncron_com_sy_tenant" + "=" + $key)) }
            let kept = $labels.without("__name__").map_each(p -> p.value.string())
            let identity = ["syncron-cpu-hours", "syncron_cpu_hours", $customer, "sum by (label_tags_syncron_com_sy_tenant, instance) (label_replace(sum_over_time(dp_dsi_pod_cpu_requests_cores[1d]), \"instance\", \"$1\", \"label_tags_syncron_com_dataops_data_service_instance\", \"(.*)\")) / 60", 86400, 1794873600, $labels.key_values().sort_by(p -> p.key)]
            meta collector_skip = if $skip { "true" }
            root = if $skip { {"skipped": $key} } else { {
              "event_id": "col_" + $identity.string().hash("sha256").encode("hex").slice(0, 40),
              "event_name": "syncron_cpu_hours",
              "external_customer_id": $customer,
              "timestamp": "2026-11-16T00:00:00Z",
              "source": "collector:syncron-cpu-hours",
              "properties": $kept.merge({"product": "dataops", "unit": "core_hours", "window_end": "2026-11-17T00:00:00Z", "window_seconds": "86400", "window_start": "2026-11-16T00:00:00Z"}).merge({"value": $raw})
            } }
  threads: 1
