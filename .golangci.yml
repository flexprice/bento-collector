# golangci-lint v2 config schema.
# Kept to the default linter set — errcheck, govet, ineffassign, staticcheck,
# unused — so CI enforces a baseline without churning existing code.
version: "2"

run:
  timeout: 5m

linters:
  default: standard

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
